<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：装成 App 全屏运行时，才能用 safe-area-inset 避开刘海与home 条 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Dove — PDF 英语阅读</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🕊️</text></svg>"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- iOS 不读 manifest 的 display/icons，这几条是「添加到主屏幕」后全屏运行的唯一开关 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dove" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="bar">
      <label class="file-btn">
        打开 PDF
        <input type="file" id="file" accept="application/pdf" hidden />
      </label>
      <button id="prev" class="nav" disabled>‹</button>
      <span id="pager"></span>
      <button id="next" class="nav" disabled>›</button>
      <div id="status"></div>
      <button id="install" class="chip" hidden>安装</button>
    </header>

    <main id="viewer">
      <div id="page">
        <canvas id="canvas"></canvas>
        <div id="text-layer" class="textLayer"></div>
      </div>
      <section id="recent" hidden></section>
      <p id="hint">选择一个 PDF 文件开始，长按单词查词</p>
    </main>

    <div id="popup" hidden></div>

    <!--
      兜底诊断：模块脚本若因浏览器版本过旧而解析失败，模块内的错误处理同样不会执行，
      页面会彻底空白且毫无提示。这段普通脚本先于模块运行，负责把原因显示出来。
    -->
    <script>
      (function () {
        var missing = [];
        if (!window.Intl || !Intl.Segmenter) missing.push("Intl.Segmenter");
        if (!window.DecompressionStream) missing.push("DecompressionStream");
        if (!Object.hasOwn) missing.push("Object.hasOwn");
        if (!window.CSS || !CSS.supports("width", "round(down, 10px, 1px)")) {
          missing.push("CSS round()");
        }

        function report(text) {
          var hint = document.getElementById("hint");
          if (!hint) return;
          hint.hidden = false;
          hint.className = "error";
          hint.textContent = text;
        }

        if (missing.length) {
          report("浏览器版本过旧，缺少：" + missing.join("、") + "。请升级 Chrome 后重试。");
        }
        addEventListener(
          "error",
          function (e) {
            report("脚本错误：" + (e.message || e.error || "未知") + "（" + (e.filename || "") + "）");
          },
          true,
        );
        addEventListener("unhandledrejection", function (e) {
          report("未处理的异常：" + ((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
