<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：装成 App 全屏运行时，才能用 safe-area-inset 避开刘海与home 条 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Dove — PDF 英语阅读</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🕊️</text></svg>"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- iOS 不读 manifest 的 display/icons，这几条是「添加到主屏幕」后全屏运行的唯一开关 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dove" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="bar">
      <div class="bar-region menu-left">
        <div class="menu-shell">
          <button
            id="file-menu"
            class="top-menu"
            type="button"
            aria-expanded="false"
            aria-controls="file-drawer"
          >
            文件
          </button>
          <div id="file-drawer" class="drawer" hidden>
            <button id="open-file" class="drawer-action" type="button">打开 PDF</button>
            <input type="file" id="file" accept="application/pdf" hidden />
            <div class="drawer-section">
              <div class="drawer-title">最近打开</div>
              <div id="recent" class="recent-list" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <button id="wordbook-menu" class="top-menu" type="button" aria-pressed="false">
          单词本
        </button>
      </div>

      <div class="bar-region page-controls" aria-label="翻页">
        <button id="prev" class="nav" disabled>‹</button>
        <span id="pager"></span>
        <button id="next" class="nav" disabled>›</button>
      </div>

      <div class="bar-region menu-shell menu-right">
        <button
          id="settings-menu"
          class="top-menu progress-button"
          type="button"
          aria-label="设置"
          aria-expanded="false"
          aria-controls="settings-drawer"
        >
          <span class="button-copy">
            <span class="button-label">设置</span>
            <span id="settings-progress" class="button-meta" hidden></span>
          </span>
        </button>
        <div id="settings-drawer" class="drawer" hidden>
          <button id="install" class="drawer-action progress-button" type="button">
            <span class="button-copy">
              <span id="install-label" class="button-label">安装</span>
              <span id="install-progress" class="button-meta" hidden></span>
            </span>
          </button>
          <label class="drawer-setting" for="online-examples">
            <span class="setting-copy">
              <span>在线例句</span>
              <span class="setting-note">展开词卡时联网获取</span>
            </span>
            <input id="online-examples" type="checkbox" role="switch" />
          </label>
          <button id="diag" class="drawer-action" type="button" title="自诊断与日志">
            <span class="button-label">诊断</span>
          </button>
          <div id="status" class="drawer-status" aria-live="polite"></div>
        </div>
      </div>
    </header>

    <main id="viewer">
      <div id="page">
        <canvas id="canvas"></canvas>
        <div id="text-layer" class="textLayer"></div>
      </div>
      <p id="hint">选择一个 PDF 文件开始，长按单词查词</p>
    </main>

    <main id="wordbook-page" hidden>
      <div class="wordbook-heading">
        <div>
          <h1>单词本</h1>
          <p id="wordbook-count">0 个单词</p>
        </div>
        <div class="wordbook-actions">
          <button id="wordbook-back" class="secondary-button" type="button">返回阅读</button>
          <button id="wordbook-manage" class="secondary-button" type="button" aria-pressed="false">
            管理
          </button>
          <button id="wordbook-delete" class="danger-button" type="button" hidden disabled>
            删除
          </button>
        </div>
      </div>

      <div class="wordbook-table-wrap">
        <table class="wordbook-table">
          <colgroup>
            <col class="wordbook-select-col" />
            <col class="wordbook-word-col" />
            <col class="wordbook-phonetic-col" />
            <col />
          </colgroup>
          <thead>
            <tr>
              <th class="wordbook-select-cell" scope="col"><span class="sr-only">选择</span></th>
              <th scope="col">单词</th>
              <th scope="col">音标</th>
              <th scope="col">词性与含义</th>
            </tr>
          </thead>
          <tbody id="wordbook-list"></tbody>
        </table>
        <p id="wordbook-empty" class="wordbook-empty">单词本还是空的，点击下方加号添加第一个单词。</p>
      </div>

      <button id="wordbook-add" class="wordbook-add" type="button" aria-label="添加单词">＋</button>
    </main>

    <dialog id="wordbook-editor" class="wordbook-editor">
      <form id="wordbook-form">
        <div class="editor-heading">
          <h2>添加单词</h2>
          <button id="wordbook-cancel" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <label for="wordbook-word">单词</label>
        <input id="wordbook-word" name="word" type="text" autocomplete="off" required />
        <p id="wordbook-lookup-status" class="lookup-status" aria-live="polite"></p>

        <label for="wordbook-phonetic">音标</label>
        <input id="wordbook-phonetic" name="phonetic" type="text" autocomplete="off" />

        <label for="wordbook-meaning">词性与含义</label>
        <textarea id="wordbook-meaning" name="meaning" rows="4"></textarea>

        <button class="primary-button" type="submit">保存</button>
      </form>
    </dialog>

    <div id="popup" hidden></div>

    <!--
      兜底诊断：模块脚本若因浏览器版本过旧而解析失败，模块内的错误处理同样不会执行，
      页面会彻底空白且毫无提示。这段普通脚本先于模块运行，负责把原因显示出来。

      它同时是日志的落点。日志必须在这里开始收集而不是在 src/diag.ts 里：
      模块没跑起来的那些故障，恰恰是最需要日志的时候。语法保持 ES5，理由同上。
    -->
    <script>
      (function () {
        var LIMIT = 400;
        var KEY = "dove.log";

        // 上一次会话的日志。崩溃或自动刷新之后，现场只剩这一份。
        var prev = [];
        try {
          prev = JSON.parse(localStorage.getItem(KEY) || "[]");
        } catch (e) {
          prev = [];
        }

        var store = {
          logs: [],
          prev: prev,
          push: push,
          // src/diag.ts 加载后会替换成真正的面板；在那之前用下面的兜底渲染
          open: fallback,
        };
        window.__dove = store;

        var saving = false;
        function flush() {
          saving = false;
          try {
            localStorage.setItem(KEY, JSON.stringify(store.logs));
          } catch (e) {
            // 隐私模式或配额满，日志留在内存里就够用了
          }
        }

        function push(level, message) {
          store.logs.push({ t: Date.now(), l: level, m: String(message).slice(0, 600) });
          if (store.logs.length > LIMIT) store.logs.splice(0, store.logs.length - LIMIT);

          // 出错的那一条立刻落盘：紧接着页面就可能崩掉或被系统回收，
          // 而那正是最需要留下的一条。其余的攒一下再写，免得刷屏时写爆主线程。
          if (level === "error") return flush();
          if (saving) return;
          saving = true;
          setTimeout(flush, 500);
        }

        // console.warn / console.error 是现成的日志入口，接管它们就不必改调用方，
        // 也能收到 pdfjs、tesseract 等第三方库自己打的告警。
        ["warn", "error"].forEach(function (level) {
          var original = console[level];
          console[level] = function () {
            var parts = [];
            for (var i = 0; i < arguments.length; i++) {
              var a = arguments[i];
              parts.push(a instanceof Error ? a.message : typeof a === "string" ? a : safe(a));
            }
            push(level, parts.join(" "));
            original.apply(console, arguments);
          };
        });

        function safe(value) {
          try {
            return JSON.stringify(value);
          } catch (e) {
            return String(value);
          }
        }

        function report(text) {
          var hint = document.getElementById("hint");
          if (!hint) return;
          hint.hidden = false;
          hint.className = "error";
          hint.textContent = text;
        }

        var missing = [];
        if (!window.Intl || !Intl.Segmenter) missing.push("Intl.Segmenter");
        if (!window.DecompressionStream) missing.push("DecompressionStream");
        if (!Object.hasOwn) missing.push("Object.hasOwn");
        if (!window.CSS || !CSS.supports("width", "round(down, 10px, 1px)")) {
          missing.push("CSS round()");
        }

        if (missing.length) {
          report("浏览器版本过旧，缺少：" + missing.join("、") + "。请升级 Chrome 后重试。");
          push("error", "缺少浏览器能力：" + missing.join("、"));
        }

        addEventListener(
          "error",
          function (e) {
            // 图片、脚本等子资源加载失败时没有 message，只有出错的元素
            var target = e.target;
            if (target && target !== window && target.tagName) {
              push("error", "资源加载失败：" + (target.src || target.href || target.tagName));
              return;
            }
            var text =
              "脚本错误：" +
              (e.message || e.error || "未知") +
              "（" +
              (e.filename || "") +
              ":" +
              (e.lineno || 0) +
              "）";
            push("error", text);
            report(text);
          },
          true,
        );

        addEventListener("unhandledrejection", function (e) {
          var reason = (e.reason && (e.reason.stack || e.reason.message)) || e.reason;
          push("error", "未处理的异常：" + reason);
          report("未处理的异常：" + ((e.reason && e.reason.message) || e.reason));
        });

        push("info", "页面加载 " + location.href);

        /** 模块没能跑起来时的最小可读版本：直接把日志倒在页面上 */
        function fallback() {
          var pre = document.createElement("pre");
          pre.id = "diag-fallback";
          pre.textContent = store.prev
            .concat(store.logs)
            .map(function (e) {
              return new Date(e.t).toISOString().slice(11, 23) + " [" + e.l + "] " + e.m;
            })
            .join("\n");
          pre.addEventListener("click", function () {
            pre.remove();
          });
          document.body.appendChild(pre);
        }

        document.getElementById("diag").addEventListener("click", function () {
          store.open();
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
